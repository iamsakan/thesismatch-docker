; XAMPP ima output_buffering vklopljen, uradna PHP slika pa ne.
; Brez tega header('Location: ...') ne deluje, ker header.php že izpiše HTML.
output_buffering = 4096

; Ne izdaj verzije PHP v HTTP glavah
expose_php = Off
; Napak ne kaži uporabniku, zapiši jih v log
display_errors = Off
log_errors = On

; Piškotek seje: ni dostopen JavaScriptu, ne pošilja se na tuje strani
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
; session.cookie_secure = 1 vklopi šele, ko bo aplikacija na HTTPS

; Seje hranimo v Redisu namesto v datotekah znotraj vsebnika
; ${REDIS_PASSWORD} PHP prebere iz okolja (docker compose -> environment)
session.save_handler = redis
session.save_path = "tcp://redis:6379?auth=${REDIS_PASSWORD}"